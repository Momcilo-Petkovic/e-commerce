spring.application.name=backend

# Machine-specific secrets (database credentials, token signing key) are kept out of version control.
# They are loaded from application-local.properties in the backend root if present.
# See application-local.properties.example for the required keys.
spring.config.import=optional:file:./application-local.properties

# Database (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/ecommerce
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
# "update" keeps the schema in sync with the entity classes during development.
# A production setup would use a migration tool (e.g. Flyway) and "validate" instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Entities are mapped to DTOs inside service transactions, so the session is not kept open during rendering.
spring.jpa.open-in-view=false

# Application settings
# Token lifetime for logged-in users.
app.jwt.ttl-hours=168
# Sales tax applied at checkout.
app.checkout.tax-rate=0.08
# Automatically moves orders through Processing -> Shipped -> Delivered to demonstrate order tracking.
app.fulfilment.simulate=true

# Email (verification codes): SMTP settings (spring.mail.*) belong in application-local.properties.
# Without them, emails are written to the application log instead of being sent.

# Cloudflare Turnstile CAPTCHA on sign-up and sign-in.
# These are Cloudflare's public test keys (always pass, localhost only); override them with real keys in production.
app.turnstile.enabled=true
app.turnstile.site-key=1x00000000000000000000AA
app.turnstile.secret-key=1x0000000000000000000000000000000AA
